
name: Daily Maintenance Bot

on:
  schedule:
    - cron: '0 0 * * *' # Todos os dias à meia-noite UTC
  workflow_dispatch:
    # Permite executar manualmente pelo GitHub Actions

permissions:
  contents: write

jobs:
  auto-commit:
    name: Automated Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Maintenance Script
        shell: bash
        run: |
          if [ ! -f "auto_maintain.py" ]; then
            echo "::error title=Script Missing::auto_maintain.py não foi localizado na raiz do repositório."
            exit 1
          fi

          echo "A executar o script de manutenção..."
          python auto_maintain.py

      - name: Validate Maintenance Output
        shell: bash
        run: |
          if [ -f "SECURITY_LOG_STATUS.md" ]; then
            echo "Ficheiro de estado encontrado."
            echo "STATUS_FILE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Status File Missing::SECURITY_LOG_STATUS.md não foi criado pelo script de manutenção."
            echo "STATUS_FILE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Commit and Push Status
        shell: bash
        run: |
          git config user.name "silvatechf"
          git config user.email "silvatechf@users.noreply.github.com"

          if [ "$STATUS_FILE_EXISTS" != "true" ]; then
            echo "Commit ignorado: o ficheiro de estado não existe."
            echo "Verifica a geração de SECURITY_LOG_STATUS.md em auto_maintain.py."
            exit 0
          fi

          git add -- SECURITY_LOG_STATUS.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no ficheiro de estado."
            echo "Não é necessário criar um commit."
            exit 0
          fi

          git commit -m "chore(bot): update security log status"

          git push
